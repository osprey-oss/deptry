[package]
name = "deptryrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "deptry"
crate-type = ["cdylib"]

[dependencies]
chardetng = "=1.0.0"
encoding_rs = "=0.8.35"
ignore = "=0.4.33"
log = "=0.4.33"
path-slash = "=0.2.1"
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "generate-import-lib"] }
pyo3-log = "=0.13.4"
rayon = "=1.12.0"
regex = "=1.13.1"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.3" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.3" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.16.3" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.3" }
serde_json = "=1.0.151"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
