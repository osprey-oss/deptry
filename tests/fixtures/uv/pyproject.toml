[project]
name = "foo"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "arrow==1.4.0",
    "pkginfo==1.13",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
foo = [
    "click==8.5.0",
    "isort==9.0.1",
]
bar = ["requests==2.34.2"]

[dependency-groups]
foo = ["certifi==2026.7.22"]
bar = ["idna==3.19"]
all = [{include-group = "foo"}, "packaging==26.3"]

[tool.uv]
dev-dependencies = [
    "black==26.5.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.deptry]
non_dev_dependency_groups = ["bar"]
optional_dependencies_dev_groups = ["bar"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pkginfo"]
