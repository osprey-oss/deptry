[project]
name = "foo"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "arrow==1.4.0",
    "pkginfo==2.0",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
foo = [
    "click==8.5.0",
    "isort==9.0.2",
]
bar = ["requests==2.34.2"]

[dependency-groups]
foo = ["certifi==2026.10.23"]
bar = ["idna==3.20"]
all = [{include-group = "foo"}, "packaging==26.3"]

[tool.uv]
dev-dependencies = [
    "black==26.10.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.deptry]
non_dev_dependency_groups = ["bar"]
optional_dependencies_dev_groups = ["bar"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pkginfo"]
