[project]
name = "foo"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "arrow==1.4.0",
    "asyncio==3.4.3",
    "click==8.5.0",
    "isort==9.0.2",
    "pkginfo==2.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "mypy==2.4.1",
]
test = ["pytest==9.2.0"]
foobar = ["urllib3==2.8.0"]

[dependency-groups]
foo = ["certifi==2026.10.23"]
bar = ["idna==3.20"]
all = [{include-group = "foo"}, "packaging==26.3"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.deptry]
non_dev_dependency_groups = ["bar"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pkginfo"]
