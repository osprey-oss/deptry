[project]
name = "foo"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "arrow==1.4.0",
    "click==8.5.0",
    "isort==9.0.2",
    "pkginfo==2.0",
    "requests==2.34.2",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "mypy==2.4.1",
]
test = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.deptry.per_rule_ignores]
DEP002 = ["pkginfo"]
